<!DOCTYPE html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitio en actualización | JENOVA Publicidad Gráfica</title>
    <meta name="description" content="JENOVA Publicidad Gráfica está actualizando temporalmente sus canales de contacto." />
    <meta name="theme-color" content="#10141b" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #10141b; color: #f7f8fa; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(rgba(16,20,27,.9), rgba(16,20,27,.96)), url("assets/img/hero-industrial-signage.png") center / cover no-repeat; }
      main { width: min(760px, calc(100% - 40px)); padding: 64px 0; text-align: center; }
      .logo { width: min(420px, 88%); height: auto; margin-bottom: 44px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; color: #f5b301; font-size: .84rem; font-weight: 700; text-transform: uppercase; }
      .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #f5b301; box-shadow: 0 0 0 6px rgba(245,179,1,.14); }
      h1 { max-width: 700px; margin: 0 auto 20px; font-size: clamp(2.3rem, 7vw, 4.7rem); line-height: 1.02; letter-spacing: 0; }
      p { max-width: 600px; margin: 0 auto; color: #c9ced8; font-size: clamp(1rem, 2vw, 1.22rem); line-height: 1.65; }
      a { display: inline-block; margin-top: 32px; color: #fff; font-weight: 700; text-decoration-color: #f5b301; text-underline-offset: 5px; }
      @media (max-width: 540px) { main { padding: 44px 0; } .logo { margin-bottom: 34px; } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/img/logo-jenova-web.png" alt="JENOVA Publicidad Gráfica" />
      <div class="status">Sitio en actualización</div>
      <h1>Estamos preparando una mejor experiencia</h1>
      <p>Estamos actualizando temporalmente nuestros canales de contacto. Muy pronto volveremos con toda la información para cotizaciones y nuevos proyectos.</p>
      <a href="mailto:contacto.jenova@gmail.com">contacto.jenova@gmail.com</a>
    </main>
  </body>
</html>
